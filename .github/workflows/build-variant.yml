name: Build an Antimatter image variant

# Builds one image variant (variants/<variant>.env): its plugins and server, then the image. Called
# by build-image.yml once per variant, so antimatter and antimatter-next are separate packages.
on:
  workflow_call:
    inputs:
      variant:
        description: Image variant, stable (ghcr.io/antimatterchat/antimatter) or next (antimatter-next)
        type: string
        required: true
      prefer_ref:
        type: string
        default: ""
      server_ref:
        type: string
        default: ""
      plugin_refs:
        type: string
        default: ""
      version:
        type: string
        default: ""
      push:
        type: boolean
        default: true
    secrets:
      ANTIMATTER_PLUGIN_SIGNING_KEY:
        required: false

permissions:
  contents: read
  packages: write

env:
  VARIANT: ${{ inputs.variant }}
  PREFER_REF: ${{ inputs.prefer_ref }}
  PLUGIN_REFS: ${{ inputs.plugin_refs }}
  SERVER_REF_OVERRIDE: ${{ inputs.server_ref }}
  BUILDX_CACHE: gha

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: plugins
        run: |
          source scripts/lib.sh
          echo "names=$(plugins_field name | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  plugin:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.setup.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Fetch sources
        run: scripts/fetch-sources.sh '${{ matrix.name }}'
      - name: Build plugin
        run: scripts/ci-run.sh "Build plugin ${{ matrix.name }}" scripts/build-plugins.sh '${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.variant }}-${{ matrix.name }}
          path: out/plugins/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Fetch sources
        run: |
          if [ -n "$SERVER_REF_OVERRIDE" ]; then export SERVER_REF="$SERVER_REF_OVERRIDE"; fi
          scripts/fetch-sources.sh server
      - name: Build server
        env:
          BUILD_NUMBER: ${{ inputs.version || github.ref_name }}-${{ github.run_number }}
        run: scripts/ci-run.sh "Build server" scripts/build-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ inputs.variant }}
          path: out/server/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [plugin, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load build settings
        run: |
          source scripts/lib.sh
          { echo "IMAGE=${IMAGE}"; echo "PLATFORMS=${PLATFORMS}"; } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-${{ inputs.variant }}-*
          path: out/plugins
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ inputs.variant }}
          path: out/server
      - name: Sign plugins
        env:
          ANTIMATTER_PLUGIN_SIGNING_KEY: ${{ secrets.ANTIMATTER_PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$ANTIMATTER_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::The ANTIMATTER_PLUGIN_SIGNING_KEY secret is not set"
            exit 1
          fi
          scripts/ci-run.sh "Sign plugins" scripts/sign-plugins.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ env.VARIANT == 'next' && 'Antimatter Next' || 'Antimatter' }}
            org.opencontainers.image.description=Antimatter team chat server with bundled plugins${{ env.VARIANT == 'next' && ', built from the antimatter-dev branches' || '' }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.VARIANT == 'stable' && 'image' || format('{0}-image', env.VARIANT) }}
          cache-to: type=gha,mode=max,scope=${{ env.VARIANT == 'stable' && 'image' || format('{0}-image', env.VARIANT) }}
