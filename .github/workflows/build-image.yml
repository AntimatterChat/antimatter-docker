name: Build Antimatter image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Sent when an antimatter-dev branch changes (see README), to rebuild antimatter-next.
  repository_dispatch:
    types: [antimatter-dev-updated]
  # Nightly antimatter-next build, picking up whatever changed on the antimatter-dev branches.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant (variants/<variant>.env); next builds ghcr.io/antimatterchat/antimatter-next
        type: choice
        options: [stable, next]
        default: stable
      prefer_ref:
        description: Branch/tag to build wherever it exists (server and plugins); others use their default
        required: false
        default: ""
      server_ref:
        description: Server ref (branch, tag or commit); overrides prefer_ref; empty = build.env SERVER_REF
        required: false
        default: ""
      plugin_refs:
        description: Per-plugin refs, overriding prefer_ref (e.g. "calls=new-ui boards=my-fix")
        required: false
        default: ""
      version:
        description: Extra image tag (e.g. 1.0.0)
        required: false
        default: ""
      push:
        description: Push the image to the registry
        type: boolean
        default: true

permissions:
  contents: read

# Pushes and tags build the stable image, repository_dispatch events and the nightly schedule the
# next one.
concurrency:
  group: build-image-${{ github.ref }}-${{ inputs.variant || ((github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'next') || 'stable' }}
  cancel-in-progress: true

env:
  VARIANT: ${{ inputs.variant || ((github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'next') || 'stable' }}
  PREFER_REF: ${{ inputs.prefer_ref }}
  PLUGIN_REFS: ${{ inputs.plugin_refs }}
  SERVER_REF_OVERRIDE: ${{ inputs.server_ref }}
  BUILDX_CACHE: gha

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: plugins
        run: |
          source scripts/lib.sh
          echo "names=$(plugins_field name | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  plugin:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.setup.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Fetch sources
        run: scripts/fetch-sources.sh '${{ matrix.name }}'
      - name: Build plugin
        run: scripts/ci-run.sh "Build plugin ${{ matrix.name }}" scripts/build-plugins.sh '${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: out/plugins/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Fetch sources
        run: |
          if [ -n "$SERVER_REF_OVERRIDE" ]; then export SERVER_REF="$SERVER_REF_OVERRIDE"; fi
          scripts/fetch-sources.sh server
      - name: Build server
        env:
          BUILD_NUMBER: ${{ inputs.version || github.ref_name }}-${{ github.run_number }}
        run: scripts/ci-run.sh "Build server" scripts/build-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/server/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [plugin, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load build settings
        run: |
          source scripts/lib.sh
          { echo "IMAGE=${IMAGE}"; echo "PLATFORMS=${PLATFORMS}"; } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: out/plugins
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: out/server
      - name: Sign plugins
        env:
          ANTIMATTER_PLUGIN_SIGNING_KEY: ${{ secrets.ANTIMATTER_PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$ANTIMATTER_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::The ANTIMATTER_PLUGIN_SIGNING_KEY secret is not set"
            exit 1
          fi
          scripts/ci-run.sh "Sign plugins" scripts/sign-plugins.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ env.VARIANT == 'next' && 'Antimatter Next' || 'Antimatter' }}
            org.opencontainers.image.description=Antimatter team chat server with bundled plugins${{ env.VARIANT == 'next' && ', built from the antimatter-dev branches' || '' }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.VARIANT == 'stable' && 'image' || format('{0}-image', env.VARIANT) }}
          cache-to: type=gha,mode=max,scope=${{ env.VARIANT == 'stable' && 'image' || format('{0}-image', env.VARIANT) }}
