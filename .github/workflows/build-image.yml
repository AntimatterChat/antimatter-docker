name: Build Antimatter images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Sent when an antimatter-dev branch changes (see README), to rebuild antimatter-next.
  repository_dispatch:
    types: [antimatter-dev-updated]
  # Nightly antimatter-next build, picking up whatever changed on the antimatter-dev branches.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant (variants/<variant>.env); next builds ghcr.io/antimatterchat/antimatter-next
        type: choice
        options: [stable, next]
        default: stable
      prefer_ref:
        description: Branch/tag to build wherever it exists (server and plugins); others use their default
        required: false
        default: ""
      server_ref:
        description: Server ref (branch, tag or commit); overrides prefer_ref; empty = build.env SERVER_REF
        required: false
        default: ""
      plugin_refs:
        description: Per-plugin refs, overriding prefer_ref (e.g. "calls=new-ui boards=my-fix")
        required: false
        default: ""
      version:
        description: Extra image tag (e.g. 1.0.0)
        required: false
        default: ""
      push:
        description: Push the image to the registry
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# Pushes to main build both images; tags build the stable one; repository_dispatch events and the
# nightly schedule build antimatter-next; manual runs build the chosen variant.
jobs:
  stable:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.variant == 'stable')
    concurrency:
      group: build-image-${{ github.ref }}-stable
      cancel-in-progress: true
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: stable
      prefer_ref: ${{ inputs.prefer_ref || '' }}
      server_ref: ${{ inputs.server_ref || '' }}
      plugin_refs: ${{ inputs.plugin_refs || '' }}
      version: ${{ inputs.version || '' }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit

  next:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'repository_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.variant == 'next')
    concurrency:
      group: build-image-${{ github.ref }}-next
      cancel-in-progress: true
    uses: ./.github/workflows/build-variant.yml
    with:
      variant: next
      prefer_ref: ${{ inputs.prefer_ref || '' }}
      server_ref: ${{ inputs.server_ref || '' }}
      plugin_refs: ${{ inputs.plugin_refs || '' }}
      version: ${{ inputs.version || '' }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit
